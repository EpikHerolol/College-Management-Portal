<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1200" width="1700" height="1200">
  <defs>
    <filter id="tblShadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="2" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="tblHdr" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <marker id="fkArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="fkArrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48"/>
    </marker>
  </defs>

  <rect width="1700" height="1200" fill="#ffffff"/>

  <!-- Diagram Title Header -->
  <g id="Header">
    <rect x="50" y="20" width="1600" height="60" rx="8" fill="#1e293b"/>
    <text x="850" y="52" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="23" font-weight="bold" fill="#ffffff" text-anchor="middle">
      RELATIONAL DATABASE SCHEMA DIAGRAM &amp; FOREIGN KEY MAPPINGS
    </text>
    <text x="850" y="70" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12.5" fill="#94a3b8" text-anchor="middle">
      Apex College Management Portal - MySQL 8.4 Normalized Relations, Keys, Constraints &amp; Referential Links
    </text>
  </g>

  <!-- ===================================================================== -->
  <!-- FOREIGN KEY CONNECTORS (Drawn behind table cards)                     -->
  <!-- ===================================================================== -->
  <g id="FK_Lines" stroke="#0284c7" stroke-width="2" fill="none" marker-end="url(#fkArrow)">
    <!-- departments.id (360, 185) -> students.department_id (360, 470) -->
    <path d="M 330 250 L 330 380 L 160 380 L 160 520 L 200 520"/>

    <!-- departments.id -> faculty.department_id -->
    <path d="M 200 185 L 120 185 L 120 450"/>

    <!-- departments.id -> courses.department_id -->
    <path d="M 460 210 L 620 210 L 620 230"/>

    <!-- users.id (1400, 220) -> faculty.user_id -->
    <path d="M 1250 200 L 100 130 L 100 450"/>

    <!-- users.id -> students.user_id -->
    <path d="M 1250 240 L 520 280 L 520 460 L 460 460"/>

    <!-- faculty.id (150, 680) -> courses.faculty_id -->
    <path d="M 150 720 L 150 780 L 650 780 L 650 330 L 670 330"/>

    <!-- students.id (330, 700) -> enrollments.student_id -->
    <path d="M 330 720 L 330 840 L 420 840"/>

    <!-- courses.id (780, 420) -> enrollments.course_id -->
    <path d="M 780 440 L 780 870 L 680 870"/>

    <!-- students.id -> attendance.student_id -->
    <path d="M 330 720 L 330 840 L 820 840"/>

    <!-- courses.id -> attendance.course_id -->
    <path d="M 850 440 L 850 870"/>

    <!-- faculty.id -> attendance.marked_by -->
    <path d="M 230 720 L 230 920 L 820 920"/>

    <!-- students.id -> results.student_id -->
    <path d="M 330 720 L 330 840 L 1220 840"/>

    <!-- courses.id -> results.course_id -->
    <path d="M 900 440 L 900 780 L 1220 780 L 1220 870"/>

    <!-- faculty.id -> results.evaluator_id -->
    <path d="M 230 720 L 230 1000 L 1220 1000"/>
  </g>

  <!-- ===================================================================== -->
  <!-- TABLE 1: DEPARTMENTS (x=200, y=110)                                   -->
  <!-- ===================================================================== -->
  <g id="Tbl_Dept" filter="url(#tblShadow)" transform="translate(200, 110)">
    <rect width="260" height="175" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="260" height="32" rx="6" fill="#1e293b"/>
    <rect y="16" width="260" height="16" fill="#1e293b"/>
    <text x="130" y="22" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">departments</text>
    <text x="15" y="55" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" font-weight="bold" fill="#0284c7">🔑 id: INT (PK, AI)</text>
    <text x="15" y="80" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#059669">code: VARCHAR(20) [UK]</text>
    <text x="15" y="105" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#334155">name: VARCHAR(100)</text>
    <text x="15" y="130" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#334155">description: TEXT</text>
    <text x="15" y="155" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#64748b">created_at: TIMESTAMP</text>
  </g>

  <!-- TABLE 2: USERS (x=1250, y=110) -->
  <g id="Tbl_Users" filter="url(#tblShadow)" transform="translate(1250, 110)">
    <rect width="260" height="200" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="260" height="32" rx="6" fill="#1e293b"/>
    <rect y="16" width="260" height="16" fill="#1e293b"/>
    <text x="130" y="22" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">users</text>
    <text x="15" y="55" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" font-weight="bold" fill="#0284c7">🔑 id: INT (PK, AI)</text>
    <text x="15" y="80" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#059669">email: VARCHAR(191) [UK]</text>
    <text x="15" y="105" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#334155">password: VARCHAR(255)</text>
    <text x="15" y="130" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#334155">role: ENUM(stu, fac, adm)</text>
    <text x="15" y="155" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#334155">status: ENUM(act, inact)</text>
    <text x="15" y="180" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#64748b">created_at: TIMESTAMP</text>
  </g>

  <!-- TABLE 3: COURSES (x=670, y=110) -->
  <g id="Tbl_Courses" filter="url(#tblShadow)" transform="translate(670, 110)">
    <rect width="280" height="300" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="280" height="32" rx="6" fill="#1e293b"/>
    <rect y="16" width="280" height="16" fill="#1e293b"/>
    <text x="140" y="22" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">courses</text>
    <text x="15" y="55" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" font-weight="bold" fill="#0284c7">🔑 id: INT (PK, AI)</text>
    <text x="15" y="80" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#059669">course_code: VARCHAR(30) [UK]</text>
    <text x="15" y="105" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#334155">title: VARCHAR(150)</text>
    <text x="15" y="130" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#0284c7">🔗 department_id: INT (FK)</text>
    <text x="15" y="155" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#334155">credits: INT (CHK 1-10)</text>
    <text x="15" y="180" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#0284c7">🔗 faculty_id: INT (FK, NULL)</text>
    <text x="15" y="205" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#d97706">capacity: INT (CHK &gt; 0)</text>
    <text x="15" y="230" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#334155">semester: INT (CHK 1-8)</text>
    <text x="15" y="255" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#334155">status: ENUM(active, inactive)</text>
    <text x="15" y="280" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#64748b">created_at: TIMESTAMP</text>
  </g>

  <!-- TABLE 4: FACULTY (x=50, y=450) -->
  <g id="Tbl_Faculty" filter="url(#tblShadow)" transform="translate(50, 450)">
    <rect width="260" height="270" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="260" height="32" rx="6" fill="#1e293b"/>
    <rect y="16" width="260" height="16" fill="#1e293b"/>
    <text x="130" y="22" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">faculty</text>
    <text x="15" y="55" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" font-weight="bold" fill="#0284c7">🔑 id: INT (PK, AI)</text>
    <text x="15" y="80" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#0284c7">🔗 user_id: INT (FK, UK)</text>
    <text x="15" y="105" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#059669">faculty_id: VARCHAR(50) [UK]</text>
    <text x="15" y="130" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#334155">first_name: VARCHAR(50)</text>
    <text x="15" y="155" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#334155">last_name: VARCHAR(50)</text>
    <text x="15" y="180" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#059669">email: VARCHAR(191) [UK]</text>
    <text x="15" y="205" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#334155">phone: VARCHAR(20)</text>
    <text x="15" y="230" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#0284c7">🔗 department_id: INT (FK)</text>
    <text x="15" y="255" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#334155">designation: VARCHAR(50)</text>
  </g>

  <!-- TABLE 5: STUDENTS (x=340, y=450) -->
  <g id="Tbl_Students" filter="url(#tblShadow)" transform="translate(340, 450)">
    <rect width="270" height="270" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="270" height="32" rx="6" fill="#1e293b"/>
    <rect y="16" width="270" height="16" fill="#1e293b"/>
    <text x="135" y="22" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">students</text>
    <text x="15" y="55" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" font-weight="bold" fill="#0284c7">🔑 id: INT (PK, AI)</text>
    <text x="15" y="80" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#0284c7">🔗 user_id: INT (FK, UK)</text>
    <text x="15" y="105" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#059669">student_id: VARCHAR(50) [UK]</text>
    <text x="15" y="130" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#334155">first_name: VARCHAR(50)</text>
    <text x="15" y="155" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#334155">last_name: VARCHAR(50)</text>
    <text x="15" y="180" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#059669">email: VARCHAR(191) [UK]</text>
    <text x="15" y="205" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#334155">phone: VARCHAR(20)</text>
    <text x="15" y="230" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#0284c7">🔗 department_id: INT (FK)</text>
    <text x="15" y="255" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#334155">semester: INT (CHK 1-8)</text>
  </g>

  <!-- TABLE 6: ENROLLMENTS (x=420, y=800) -->
  <g id="Tbl_Enrollments" filter="url(#tblShadow)" transform="translate(420, 800)">
    <rect width="260" height="200" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="260" height="32" rx="6" fill="#4338ca"/>
    <rect y="16" width="260" height="16" fill="#4338ca"/>
    <text x="130" y="22" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">enrollments</text>
    <text x="15" y="55" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" font-weight="bold" fill="#0284c7">🔑 id: INT (PK, AI)</text>
    <text x="15" y="80" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#0284c7">🔗 student_id: INT (FK)</text>
    <text x="15" y="105" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#0284c7">🔗 course_id: INT (FK)</text>
    <text x="15" y="130" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#334155">enrollment_date: TIMESTAMP</text>
    <text x="15" y="155" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#334155">status: ENUM(enrolled, dropped)</text>
    <text x="15" y="180" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="11" font-weight="bold" fill="#7c3aed">★ UK(student_id, course_id)</text>
  </g>

  <!-- TABLE 7: ATTENDANCE (x=820, y=800) -->
  <g id="Tbl_Attendance" filter="url(#tblShadow)" transform="translate(820, 800)">
    <rect width="280" height="200" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="280" height="32" rx="6" fill="#4338ca"/>
    <rect y="16" width="280" height="16" fill="#4338ca"/>
    <text x="140" y="22" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">attendance</text>
    <text x="15" y="55" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" font-weight="bold" fill="#0284c7">🔑 id: INT (PK, AI)</text>
    <text x="15" y="80" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#0284c7">🔗 student_id: INT (FK)</text>
    <text x="15" y="105" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#0284c7">🔗 course_id: INT (FK)</text>
    <text x="15" y="130" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#334155">attendance_date: DATE</text>
    <text x="15" y="155" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#334155">status: ENUM(Present, Absent)</text>
    <text x="15" y="180" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#0284c7">🔗 marked_by: INT (FK-&gt;faculty)</text>
  </g>

  <!-- TABLE 8: RESULTS (x=1220, y=750) -->
  <g id="Tbl_Results" filter="url(#tblShadow)" transform="translate(1220, 750)">
    <rect width="280" height="270" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="280" height="32" rx="6" fill="#4338ca"/>
    <rect y="16" width="280" height="16" fill="#4338ca"/>
    <text x="140" y="22" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">results</text>
    <text x="15" y="55" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" font-weight="bold" fill="#0284c7">🔑 id: INT (PK, AI)</text>
    <text x="15" y="80" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#0284c7">🔗 student_id: INT (FK)</text>
    <text x="15" y="105" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#0284c7">🔗 course_id: INT (FK)</text>
    <text x="15" y="130" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#334155">marks: DECIMAL(5,2)</text>
    <text x="15" y="155" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#334155">max_marks: DECIMAL(5,2)</text>
    <text x="15" y="180" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#d97706">grade: VARCHAR(5) [Trigger]</text>
    <text x="15" y="205" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#334155">semester: INT (CHK 1-8)</text>
    <text x="15" y="230" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#0284c7">🔗 evaluator_id: INT (FK-&gt;faculty)</text>
    <text x="15" y="255" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="11" font-weight="bold" fill="#7c3aed">★ UK(student, course, semester)</text>
  </g>

  <!-- ===================================================================== -->
  <!-- LEGEND                                                                -->
  <!-- ===================================================================== -->
  <g id="Legend" filter="url(#tblShadow)">
    <rect x="50" y="1070" width="1600" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="70" y="1095" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="13" font-weight="bold" fill="#0f172a">Schema Notation &amp; Integrity Constraints:</text>
    <text x="70" y="1120" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#0284c7">🔑 Primary Key (PK)</text>
    <text x="240" y="1120" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#0284c7">🔗 Foreign Key (FK) with Referential Cascade / Restrict</text>
    <text x="630" y="1120" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#059669">[UK] Unique Key Constraint</text>
    <text x="830" y="1120" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#d97706">[CHK] Domain Check Constraint</text>
    <text x="1060" y="1120" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#7c3aed">★ Composite Unique Key (No duplicates)</text>
  </g>
</svg>
