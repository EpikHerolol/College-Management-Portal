<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="1600" height="1150">
  <defs>
    <filter id="archShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="2" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="tier1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>

    <linearGradient id="tier2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>

    <linearGradient id="tier3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>

    <marker id="flowArrowDown" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 0 L 5 10 z" fill="#0284c7"/>
    </marker>
    <marker id="flowArrowUp" viewBox="0 0 10 10" refX="5" refY="2" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 10 L 10 10 L 5 0 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="1600" height="1150" fill="#ffffff"/>

  <!-- Diagram Title Header -->
  <g id="Header">
    <rect x="50" y="25" width="1500" height="65" rx="8" fill="#1e293b"/>
    <text x="800" y="58" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
      3-TIER APPLICATION SYSTEM ARCHITECTURE
    </text>
    <text x="800" y="80" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="13" fill="#94a3b8" text-anchor="middle">
      Apex College Management Portal - Presentation Client, Express.js REST API &amp; MySQL 8.4 InnoDB Database
    </text>
  </g>

  <!-- ===================================================================== -->
  <!-- TIER 1: CLIENT PRESENTATION TIER                                      -->
  <!-- ===================================================================== -->
  <g id="Tier1" filter="url(#archShadow)">
    <rect x="50" y="115" width="1500" height="235" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect x="50" y="115" width="1500" height="38" rx="12" fill="#2563eb"/>
    <rect x="50" y="135" width="1500" height="18" fill="#2563eb"/>
    <text x="800" y="140" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
      TIER 1: PRESENTATION LAYER (React 18 SPA + Vite + Tailwind CSS)
    </text>

    <!-- Client Component 1: Student App -->
    <g transform="translate(85, 170)">
      <rect width="420" height="160" rx="8" fill="url(#tier1Grad)" stroke="#93c5fd" stroke-width="1.8"/>
      <rect width="420" height="30" rx="8" fill="#3b82f6"/>
      <rect y="15" width="420" height="15" fill="#3b82f6"/>
      <text x="210" y="21" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="middle">
        STUDENT PORTAL
      </text>
      <text x="20" y="55" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12.5" fill="#1e3a8a">• Course Registration with Live Capacity Meters</text>
      <text x="20" y="80" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12.5" fill="#1e3a8a">• Registered Course Roster &amp; Drop Modal</text>
      <text x="20" y="105" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12.5" fill="#1e3a8a">• Attendance History &amp; Compliance Bar</text>
      <text x="20" y="130" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12.5" fill="#1e3a8a">• Grade Transcript &amp; Semester GPA</text>
      <text x="20" y="150" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="11" fill="#3b82f6">(Responsive Tailwind UI, Lucide Icons)</text>
    </g>

    <!-- Client Component 2: Faculty App -->
    <g transform="translate(590, 170)">
      <rect width="420" height="160" rx="8" fill="url(#tier1Grad)" stroke="#93c5fd" stroke-width="1.8"/>
      <rect width="420" height="30" rx="8" fill="#3b82f6"/>
      <rect y="15" width="420" height="15" fill="#3b82f6"/>
      <text x="210" y="21" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="middle">
        FACULTY PORTAL
      </text>
      <text x="20" y="55" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12.5" fill="#1e3a8a">• Assigned Course Roster &amp; Student Cards</text>
      <text x="20" y="80" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12.5" fill="#1e3a8a">• One-Click Attendance Grid (Present/Absent)</text>
      <text x="20" y="105" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12.5" fill="#1e3a8a">• Student Examination Mark Entry Form</text>
      <text x="20" y="130" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12.5" fill="#1e3a8a">• Attendance Defaulter Alerts (&lt; 75%)</text>
      <text x="20" y="150" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="11" fill="#3b82f6">(Instant Validation &amp; Toast Notifications)</text>
    </g>

    <!-- Client Component 3: Admin Dashboard -->
    <g transform="translate(1095, 170)">
      <rect width="420" height="160" rx="8" fill="url(#tier1Grad)" stroke="#93c5fd" stroke-width="1.8"/>
      <rect width="420" height="30" rx="8" fill="#3b82f6"/>
      <rect y="15" width="420" height="15" fill="#3b82f6"/>
      <text x="210" y="21" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="middle">
        ADMINISTRATOR DASHBOARD
      </text>
      <text x="20" y="55" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12.5" fill="#1e3a8a">• Institutional Metrics: Students, Faculty, Courses</text>
      <text x="20" y="80" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12.5" fill="#1e3a8a">• Department Directory &amp; Catalog Management</text>
      <text x="20" y="105" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12.5" fill="#1e3a8a">• Concurrency Health &amp; Capacity Utilization</text>
      <text x="20" y="130" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12.5" fill="#1e3a8a">• One-Click CSV Report Exports</text>
      <text x="20" y="150" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="11" fill="#3b82f6">(Full Administrative Governance Suite)</text>
    </g>
  </g>

  <!-- PROTOCOL 1: HTTPS REST API / JSON -->
  <g id="Proto1">
    <line x1="800" y1="355" x2="800" y2="445" stroke="#0284c7" stroke-width="3" stroke-dasharray="6,4"/>
    <rect x="520" y="375" width="560" height="44" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
    <text x="800" y="396" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="middle">
      HTTPS REST API / JSON PAYLOADS
    </text>
    <text x="800" y="411" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="11" fill="#0284c7" text-anchor="middle">
      Bearer JWT Authorization Headers | Axios HTTP Client | CORS
    </text>
  </g>

  <!-- ===================================================================== -->
  <!-- TIER 2: APPLICATION BACKEND (EXPRESS.JS REST API)                     -->
  <!-- ===================================================================== -->
  <g id="Tier2" filter="url(#archShadow)">
    <rect x="50" y="455" width="1500" height="260" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <rect x="50" y="455" width="1500" height="38" rx="12" fill="#16a34a"/>
    <rect x="50" y="475" width="1500" height="18" fill="#16a34a"/>
    <text x="800" y="480" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
      TIER 2: APPLICATION BUSINESS LOGIC LAYER (Node.js + Express.js API)
    </text>

    <!-- Middleware Sub-box -->
    <g transform="translate(85, 510)">
      <rect width="420" height="185" rx="8" fill="url(#tier2Grad)" stroke="#86efac" stroke-width="1.8"/>
      <rect width="420" height="28" rx="8" fill="#22c55e"/>
      <rect y="14" width="420" height="14" fill="#22c55e"/>
      <text x="210" y="20" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
        SECURITY &amp; MIDDLEWARE PIPELINE
      </text>
      <text x="20" y="55" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#14532d">• JWT Auth Middleware (verifyToken)</text>
      <text x="20" y="80" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#14532d">• RBAC Role Guard (requireRole: Admin/Fac/Stu)</text>
      <text x="20" y="105" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#14532d">• Bcrypt Hashing (10 Salt Rounds)</text>
      <text x="20" y="130" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#14532d">• Express Validator (Sanitization &amp; Bounds)</text>
      <text x="20" y="155" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#14532d">• Centralized Error Handling Middleware</text>
    </g>

    <!-- Core Business Services Sub-box -->
    <g transform="translate(590, 510)">
      <rect width="420" height="185" rx="8" fill="url(#tier2Grad)" stroke="#86efac" stroke-width="1.8"/>
      <rect width="420" height="28" rx="8" fill="#22c55e"/>
      <rect y="14" width="420" height="14" fill="#22c55e"/>
      <text x="210" y="20" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
        CORE BUSINESS SERVICES &amp; CONTROLLERS
      </text>
      <text x="20" y="55" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#14532d">• Course Registration Controller</text>
      <text x="20" y="80" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#14532d">• Transaction Coordinator (Row Locking)</text>
      <text x="20" y="105" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#14532d">• Attendance Recording &amp; Defaulter Logic</text>
      <text x="20" y="130" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#14532d">• Grading &amp; Result Calculation Controller</text>
      <text x="20" y="155" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#14532d">• Report Generator &amp; CSV Stream Service</text>
    </g>

    <!-- Driver & Pool Sub-box -->
    <g transform="translate(1095, 510)">
      <rect width="420" height="185" rx="8" fill="url(#tier2Grad)" stroke="#86efac" stroke-width="1.8"/>
      <rect width="420" height="28" rx="8" fill="#22c55e"/>
      <rect y="14" width="420" height="14" fill="#22c55e"/>
      <text x="210" y="20" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
        DATABASE DRIVER &amp; CONNECTION POOL
      </text>
      <text x="20" y="55" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#14532d">• mysql2/promise Connection Pooling</text>
      <text x="20" y="80" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#14532d">• Connection Pool (Max: 10 connections)</text>
      <text x="20" y="105" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#14532d">• Parameterized SQL Prepared Statements</text>
      <text x="20" y="130" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#14532d">• Transaction Contexts (COMMIT/ROLLBACK)</text>
      <text x="20" y="155" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#14532d">• Deadlock Retry Mechanism (Error 1213)</text>
    </g>
  </g>

  <!-- PROTOCOL 2: MYSQL TCP / PROTOCOL -->
  <g id="Proto2">
    <line x1="800" y1="720" x2="800" y2="805" stroke="#7c3aed" stroke-width="3" stroke-dasharray="6,4"/>
    <rect x="520" y="740" width="560" height="44" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="800" y="761" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="13" font-weight="bold" fill="#6d28d9" text-anchor="middle">
      MYSQL PROTOCOL (TCP / UNIX DOMAIN SOCKET)
    </text>
    <text x="800" y="776" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="11" fill="#7c3aed" text-anchor="middle">
      START TRANSACTION | SELECT ... FOR UPDATE | COMMIT | ROLLBACK
    </text>
  </g>

  <!-- ===================================================================== -->
  <!-- TIER 3: DATABASE STORAGE LAYER (MYSQL 8.4 INNODB)                     -->
  <!-- ===================================================================== -->
  <g id="Tier3" filter="url(#archShadow)">
    <rect x="50" y="815" width="1500" height="280" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="50" y="815" width="1500" height="38" rx="12" fill="#7c3aed"/>
    <rect x="50" y="835" width="1500" height="18" fill="#7c3aed"/>
    <text x="800" y="840" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
      TIER 3: DATABASE ENGINE &amp; STORAGE LAYER (MySQL 8.4 LTS InnoDB)
    </text>

    <!-- DB Sub-box 1: Tables -->
    <g transform="translate(85, 870)">
      <rect width="420" height="205" rx="8" fill="url(#tier3Grad)" stroke="#c4b5fd" stroke-width="1.8"/>
      <rect width="420" height="28" rx="8" fill="#8b5cf6"/>
      <rect y="14" width="420" height="14" fill="#8b5cf6"/>
      <text x="210" y="20" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
        NORMALIZED RELATIONAL TABLES
      </text>
      <text x="20" y="55" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#4c1d95">• departments, users, faculty, students</text>
      <text x="20" y="80" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#4c1d95">• courses, enrollments, attendance, results</text>
      <text x="20" y="105" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#4c1d95">• attendance_defaulters (Audit Log Table)</text>
      <text x="20" y="130" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#4c1d95">• BCNF &amp; 3NF Formats (Zero Data Redundancy)</text>
      <text x="20" y="155" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#4c1d95">• Foreign Key Cascades &amp; Restrict Rules</text>
      <text x="20" y="180" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#4c1d95">• UTF8MB4 Unicode Charset Enforcement</text>
    </g>

    <!-- DB Sub-box 2: Concurrency & Storage -->
    <g transform="translate(590, 870)">
      <rect width="420" height="205" rx="8" fill="url(#tier3Grad)" stroke="#c4b5fd" stroke-width="1.8"/>
      <rect width="420" height="28" rx="8" fill="#8b5cf6"/>
      <rect y="14" width="420" height="14" fill="#8b5cf6"/>
      <text x="210" y="20" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
        CONCURRENCY &amp; STORAGE ENGINE
      </text>
      <text x="20" y="55" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#4c1d95">• InnoDB Row-Level Exclusive Locks (X-Locks)</text>
      <text x="20" y="80" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#4c1d95">• Repeatable Read Isolation Level (Snapshot)</text>
      <text x="20" y="105" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#4c1d95">• Deadlock Detection via Wait-For Graphs</text>
      <text x="20" y="130" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#4c1d95">• B+ Tree Clustered &amp; Secondary Indexes</text>
      <text x="20" y="155" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#4c1d95">• InnoDB Buffer Pool (In-memory page cache)</text>
      <text x="20" y="180" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#4c1d95">• Sequential Redo Log (WAL Crash Recovery)</text>
    </g>

    <!-- DB Sub-box 3: Stored Routines -->
    <g transform="translate(1095, 870)">
      <rect width="420" height="205" rx="8" fill="url(#tier3Grad)" stroke="#c4b5fd" stroke-width="1.8"/>
      <rect width="420" height="28" rx="8" fill="#8b5cf6"/>
      <rect y="14" width="420" height="14" fill="#8b5cf6"/>
      <text x="210" y="20" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
        STORED ROUTINES &amp; VIEWS
      </text>
      <text x="20" y="55" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#4c1d95">• sp_EnrollStudent (Atomic Transaction Logic)</text>
      <text x="20" y="80" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#4c1d95">• fn_CalculateGrade (Deterministic Grading)</text>
      <text x="20" y="105" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#4c1d95">• trg_before_insert_result (Boundary Trigger)</text>
      <text x="20" y="130" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#4c1d95">• trg_before_update_result (Grade Sync Trigger)</text>
      <text x="20" y="155" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#4c1d95">• sp_IdentifyAttendanceDefaulters (Cursor)</text>
      <text x="20" y="180" font-family="Liberation Sans, DejaVu Sans, Arial" font-size="12" fill="#4c1d95">• v_course_enrollment_summary (View)</text>
    </g>
  </g>
</svg>
